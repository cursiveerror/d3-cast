<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0A0A0A; }
      .text-bold { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; }
      .text-regular { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 400; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="800" height="220" />

  <!-- Main Metro Tile (D3 Cast) -->
  <g id="main-brand-tile">
    <rect x="30" y="30" width="500" height="160" fill="#2A81EA" />
    <text x="60" y="115" fill="#FFFFFF" class="text-bold" font-size="56" letter-spacing="-1">D3 Cast</text>
    <text x="63" y="150" fill="#FFFFFF" class="text-regular" font-size="15" opacity="0.85" letter-spacing="2">WEATHER DASHBOARD</text>
  </g>

  <!-- Accent Tiles Grid -->
  <g id="accent-tiles">
    <!-- Top Left Accent (Orange) -->
    <rect x="545" y="30" width="105" height="73" fill="#F07A00" />
    
    <!-- Top Right Accent (Green) -->
    <rect x="665" y="30" width="105" height="73" fill="#00C853" />
    
    <!-- Bottom Left Accent (Purple) -->
    <rect x="545" y="117" width="105" height="73" fill="#603FBE" />
    
    <!-- Bottom Right Accent (Teal) -->
    <rect x="665" y="117" width="105" height="73" fill="#00A3A3" />
  </g>
</svg>
